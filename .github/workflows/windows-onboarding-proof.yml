name: Windows onboarding proof

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full candidate commit SHA approved for the prepared fixture
        required: true
        type: string

permissions:
  contents: read

env:
  EVENT_NAME: ${{ github.event_name }}
  REQUEST_REF: ${{ github.ref }}
  REQUEST_ACTOR: ${{ github.actor }}
  RUN_ATTEMPT: ${{ github.run_attempt }}
  WORKFLOW_REF: ${{ github.workflow_ref }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  DRIVER_SHA: ${{ github.workflow_sha }}
  PREMERGE_REF: ${{ vars.ONBOARDING_PREMERGE_REF }}
  PREMERGE_DRIVER_SHA: ${{ vars.ONBOARDING_PREMERGE_DRIVER_SHA }}
  PREMERGE_CANDIDATE_SHA: ${{ vars.ONBOARDING_PREMERGE_CANDIDATE_SHA }}

concurrency:
  group: windows-onboarding-prepared-v1
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Validate immutable candidate without host access
        id: validate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_ACTOR: ${{ github.actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # proof-authority-start
          [[ "$EVENT_NAME" == workflow_dispatch && "$REQUEST_ACTOR" == BramVR && "$RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == BramVR/blender-box ]] || exit 1
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/windows-onboarding-proof.yml@$REQUEST_REF" ]] || exit 1
          if [[ "$REQUEST_REF" != refs/heads/main ]]; then
            [[ "$PREMERGE_REF" == refs/heads/* && "$REQUEST_REF" == "$PREMERGE_REF" ]] || exit 1
            [[ "$DRIVER_SHA" == "$PREMERGE_DRIVER_SHA" && "$CANDIDATE_SHA" == "$PREMERGE_CANDIDATE_SHA" ]] || exit 1
          fi
          # proof-authority-end
          resolved=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA" --jq .sha)
          [[ "$resolved" == "$CANDIDATE_SHA" ]]
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Approve candidate [%s](https://github.com/%s/commit/%s) for prepared fixture windows-onboarding-prepared-v1. Permitted operations are one owned install, one client pairing with host-local offer, enrollment and revocation, a baseline Run through the paired target, and removal on the dedicated controller fixture, plus the declared named-target Run, each with exact recovery. Reruns are refused; dispatch a fresh approval.\n' "$CANDIDATE_SHA" "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

  authorize:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: windows-onboarding-approval
    steps:
      - name: Bind protected environment approval to this candidate
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          # proof-authority-start
          [[ "$EVENT_NAME" == workflow_dispatch && "$REQUEST_ACTOR" == BramVR && "$RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == BramVR/blender-box ]] || exit 1
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/windows-onboarding-proof.yml@$REQUEST_REF" ]] || exit 1
          if [[ "$REQUEST_REF" != refs/heads/main ]]; then
            [[ "$PREMERGE_REF" == refs/heads/* && "$REQUEST_REF" == "$PREMERGE_REF" ]] || exit 1
            [[ "$DRIVER_SHA" == "$PREMERGE_DRIVER_SHA" && "$CANDIDATE_SHA" == "$PREMERGE_CANDIDATE_SHA" ]] || exit 1
          fi
          # proof-authority-end
          printf 'Authorized candidate %s.\n' "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

  baseline:
    name: baseline
    needs: [candidate, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 105
    environment: windows-onboarding-installer
    permissions:
      contents: read
      id-token: write
    outputs:
      expires_at: ${{ steps.bind.outputs.expires_at }}
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      DRIVER_SHA: ${{ github.workflow_sha }}
      PROOF_EXECUTION_ID: gha_${{ github.run_id }}_onboarding
    steps:
      - name: Reject reruns before controller authorization
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # proof-authority-start
          [[ "$EVENT_NAME" == workflow_dispatch && "$REQUEST_ACTOR" == BramVR && "$RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == BramVR/blender-box ]] || exit 1
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/windows-onboarding-proof.yml@$REQUEST_REF" ]] || exit 1
          if [[ "$REQUEST_REF" != refs/heads/main ]]; then
            [[ "$PREMERGE_REF" == refs/heads/* && "$REQUEST_REF" == "$PREMERGE_REF" ]] || exit 1
            [[ "$DRIVER_SHA" == "$PREMERGE_DRIVER_SHA" && "$CANDIDATE_SHA" == "$PREMERGE_CANDIDATE_SHA" ]] || exit 1
          fi
          # proof-authority-end
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Verify both immutable checkouts
        run: |
          set -euo pipefail
          [[ "$(git -C driver rev-parse HEAD)" == "$DRIVER_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bind protected fixture grant and dedicated controller trust
        id: bind
        env:
          INSTALL_OPERATOR_CONFIG: ${{ secrets.ONBOARDING_INSTALL_OPERATOR_CONFIG }}
          INSTALL_CONTROLLER_CONFIG: ${{ secrets.ONBOARDING_INSTALL_CONTROLLER_CONFIG }}
          INSTALL_CONTROLLER_KEY: ${{ secrets.ONBOARDING_INSTALL_CONTROLLER_KEY }}
          INSTALL_CONTROLLER_KNOWN_HOSTS: ${{ secrets.ONBOARDING_INSTALL_CONTROLLER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 driver/scripts/proof_dispatch.py prepare --directory "$RUNNER_TEMP/onboarding-proof" >> "$GITHUB_OUTPUT"
      - name: Connect to the qualified persistent controller
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.ONBOARDING_INSTALL_TS_CLIENT_ID }}
          audience: ${{ vars.ONBOARDING_INSTALL_TS_AUDIENCE }}
          tags: tag:blender-box-install-dispatch
          use-cache: false
          hostname: blender-box-proof-dispatch-${{ github.run_id }}
      - name: Dispatch the retained onboarding proof
        timeout-minutes: 80
        run: |
          set -euo pipefail
          python3 driver/scripts/proof_dispatch.py start --directory "$RUNNER_TEMP/onboarding-proof"
      - name: Recover through the durable owner and require settlement
        if: always()
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 driver/scripts/proof_dispatch.py recover --directory "$RUNNER_TEMP/onboarding-proof"
      - name: Collect the controller-validated baseline evidence
        if: always()
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 driver/scripts/proof_dispatch.py collect --directory "$RUNNER_TEMP/onboarding-proof"
      - name: Upload allowlisted proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-onboarding-${{ needs.candidate.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/onboarding-proof/public/receipt.json
            ${{ runner.temp }}/onboarding-proof/public/outcome.json
            ${{ runner.temp }}/onboarding-proof/public/viewport.png
      - name: Remove only this job's dispatch credentials
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "onboarding-proof"
          for name in ("key", "known_hosts", "ssh-config", "operator.json"):
              (root / name).unlink(missing_ok=True)
          PYTHON

  named-target:
    name: named-target
    needs: [candidate, authorize, baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: windows-onboarding-host
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      DRIVER_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Reject reruns before credentials or candidate code
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # proof-authority-start
          [[ "$EVENT_NAME" == workflow_dispatch && "$REQUEST_ACTOR" == BramVR && "$RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == BramVR/blender-box ]] || exit 1
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/windows-onboarding-proof.yml@$REQUEST_REF" ]] || exit 1
          if [[ "$REQUEST_REF" != refs/heads/main ]]; then
            [[ "$PREMERGE_REF" == refs/heads/* && "$REQUEST_REF" == "$PREMERGE_REF" ]] || exit 1
            [[ "$DRIVER_SHA" == "$PREMERGE_DRIVER_SHA" && "$CANDIDATE_SHA" == "$PREMERGE_CANDIDATE_SHA" ]] || exit 1
          fi
          # proof-authority-end
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Verify both checkouts
        run: |
          set -euo pipefail
          [[ "$(git -C driver rev-parse HEAD)" == "$DRIVER_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: candidate/go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare task-local SSH credentials
        env:
          OPERATOR_CONFIG: ${{ secrets.ONBOARDING_OPERATOR_CONFIG }}
          SSH_KEY: ${{ secrets.ONBOARDING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ONBOARDING_KNOWN_HOSTS }}
          SSH_HOSTNAME: ${{ secrets.ONBOARDING_SSH_HOSTNAME }}
          TS_CLIENT_ID: ${{ secrets.ONBOARDING_TS_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.ONBOARDING_TS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "driver/scripts")
          from onboarding_proof import ProofError, prepare_hosted_credentials
          try:
              prepare_hosted_credentials(os.environ)
          except (ProofError, OSError, ValueError, KeyError):
              raise SystemExit("Onboarding credential preparation failed.")
          PY
      - name: Connect ephemeral controller
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.ONBOARDING_TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.ONBOARDING_TS_CLIENT_SECRET }}
          tags: tag:blender-box-onboarding
          use-cache: false
          hostname: blender-box-named-proof-${{ github.run_id }}
      - name: Run the approved named-target proof
        run: |
          set -euo pipefail
          python3 driver/scripts/onboarding_proof.py named-target \
            --candidate "$CANDIDATE_SHA" \
            --candidate-checkout "$GITHUB_WORKSPACE/candidate" \
            --operator-config "$RUNNER_TEMP/onboarding-credentials/operator.json" \
            --output "$RUNNER_TEMP/onboarding-named-target-proof" \
            --execution hosted --driver-sha "$DRIVER_SHA"
      - name: Require a public result
        if: always()
        run: test -f "$RUNNER_TEMP/onboarding-named-target-proof/public/outcome.json"
      - name: Upload allowlisted proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-onboarding-named-target-${{ needs.candidate.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/onboarding-named-target-proof/public/outcome.json
            ${{ runner.temp }}/onboarding-named-target-proof/public/viewport.png
      - name: Remove only this job's credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "onboarding-credentials"
          for name in ("key", "known_hosts", "config", "operator.json"):
              (root / name).unlink(missing_ok=True)
          PY

  host-install:
    name: host-install
    needs: [candidate, authorize, baseline]
    if: always() && needs.candidate.result == 'success' && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: windows-onboarding-installer
    permissions:
      contents: read
      id-token: write
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      DRIVER_SHA: ${{ github.workflow_sha }}
      PROOF_EXECUTION_ID: gha_${{ github.run_id }}_onboarding
    steps:
      - name: Reject reruns before installer authorization
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # proof-authority-start
          [[ "$EVENT_NAME" == workflow_dispatch && "$REQUEST_ACTOR" == BramVR && "$RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == BramVR/blender-box ]] || exit 1
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/windows-onboarding-proof.yml@$REQUEST_REF" ]] || exit 1
          if [[ "$REQUEST_REF" != refs/heads/main ]]; then
            [[ "$PREMERGE_REF" == refs/heads/* && "$REQUEST_REF" == "$PREMERGE_REF" ]] || exit 1
            [[ "$DRIVER_SHA" == "$PREMERGE_DRIVER_SHA" && "$CANDIDATE_SHA" == "$PREMERGE_CANDIDATE_SHA" ]] || exit 1
          fi
          # proof-authority-end
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Verify both immutable checkouts
        run: |
          set -euo pipefail
          [[ "$(git -C driver rev-parse HEAD)" == "$DRIVER_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bind protected installer grant and dedicated controller trust
        env:
          INSTALL_OPERATOR_CONFIG: ${{ secrets.ONBOARDING_INSTALL_OPERATOR_CONFIG }}
          INSTALL_CONTROLLER_CONFIG: ${{ secrets.ONBOARDING_INSTALL_CONTROLLER_CONFIG }}
          INSTALL_CONTROLLER_KEY: ${{ secrets.ONBOARDING_INSTALL_CONTROLLER_KEY }}
          INSTALL_CONTROLLER_KNOWN_HOSTS: ${{ secrets.ONBOARDING_INSTALL_CONTROLLER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 driver/scripts/proof_dispatch.py prepare --directory "$RUNNER_TEMP/onboarding-host-install-proof"
      - name: Connect to the qualified persistent controller
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.ONBOARDING_INSTALL_TS_CLIENT_ID }}
          audience: ${{ vars.ONBOARDING_INSTALL_TS_AUDIENCE }}
          tags: tag:blender-box-install-dispatch
          use-cache: false
          hostname: blender-box-install-dispatch-${{ github.run_id }}
      - name: Recover the onboarding execution and require installer settlement
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 driver/scripts/proof_dispatch.py recover --directory "$RUNNER_TEMP/onboarding-host-install-proof"
      - name: Upload only the validated public controller receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-onboarding-host-install-${{ needs.candidate.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/onboarding-host-install-proof/public/receipt.json
      - name: Remove only this job's dispatch credentials
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "onboarding-host-install-proof"
          for name in ("key", "known_hosts", "ssh-config", "operator.json"):
              (root / name).unlink(missing_ok=True)
          PYTHON

  pair-and-run:
    name: pair-and-run
    needs: [candidate, authorize, baseline]
    if: always() && needs.candidate.result == 'success' && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: windows-onboarding-installer
    permissions:
      contents: read
      id-token: write
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      DRIVER_SHA: ${{ github.workflow_sha }}
      PROOF_EXECUTION_ID: gha_${{ github.run_id }}_onboarding
      REQUEST_EXPIRES_AT: ${{ needs.baseline.outputs.expires_at }}
    steps:
      - name: Reject reruns before installer authorization
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # proof-authority-start
          [[ "$EVENT_NAME" == workflow_dispatch && "$REQUEST_ACTOR" == BramVR && "$RUN_ATTEMPT" == 1 ]] || exit 1
          [[ "$GITHUB_REPOSITORY" == BramVR/blender-box ]] || exit 1
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/windows-onboarding-proof.yml@$REQUEST_REF" ]] || exit 1
          if [[ "$REQUEST_REF" != refs/heads/main ]]; then
            [[ "$PREMERGE_REF" == refs/heads/* && "$REQUEST_REF" == "$PREMERGE_REF" ]] || exit 1
            [[ "$DRIVER_SHA" == "$PREMERGE_DRIVER_SHA" && "$CANDIDATE_SHA" == "$PREMERGE_CANDIDATE_SHA" ]] || exit 1
          fi
          # proof-authority-end
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Verify both immutable checkouts
        run: |
          set -euo pipefail
          [[ "$(git -C driver rev-parse HEAD)" == "$DRIVER_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bind protected installer grant and dedicated controller trust
        env:
          INSTALL_OPERATOR_CONFIG: ${{ secrets.ONBOARDING_INSTALL_OPERATOR_CONFIG }}
          INSTALL_CONTROLLER_CONFIG: ${{ secrets.ONBOARDING_INSTALL_CONTROLLER_CONFIG }}
          INSTALL_CONTROLLER_KEY: ${{ secrets.ONBOARDING_INSTALL_CONTROLLER_KEY }}
          INSTALL_CONTROLLER_KNOWN_HOSTS: ${{ secrets.ONBOARDING_INSTALL_CONTROLLER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 driver/scripts/proof_dispatch.py prepare --directory "$RUNNER_TEMP/onboarding-pair-and-run-proof"
      - name: Connect to the qualified persistent controller
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.ONBOARDING_INSTALL_TS_CLIENT_ID }}
          audience: ${{ vars.ONBOARDING_INSTALL_TS_AUDIENCE }}
          tags: tag:blender-box-install-dispatch
          use-cache: false
          hostname: blender-box-pair-dispatch-${{ github.run_id }}
      - name: Recover the onboarding execution and require installer settlement
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 driver/scripts/proof_dispatch.py recover --directory "$RUNNER_TEMP/onboarding-pair-and-run-proof"
      - name: Collect and require every pairing outcome from the controller
        if: always()
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 driver/scripts/proof_dispatch.py collect --directory "$RUNNER_TEMP/onboarding-pair-and-run-proof"
      - name: Upload the validated public pairing outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-onboarding-pair-and-run-${{ needs.candidate.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/onboarding-pair-and-run-proof/public/receipt.json
            ${{ runner.temp }}/onboarding-pair-and-run-proof/public/outcome.json
      - name: Remove only this job's dispatch credentials
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "onboarding-pair-and-run-proof"
          for name in ("key", "known_hosts", "ssh-config", "operator.json"):
              (root / name).unlink(missing_ok=True)
          PYTHON
