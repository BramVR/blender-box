name: Windows onboarding proof

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full candidate commit SHA approved for the prepared fixture
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-onboarding-prepared-v1
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Validate immutable candidate without host access
        id: validate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_ACTOR: ${{ github.actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == workflow_dispatch && "$REQUEST_REF" == refs/heads/main ]]
          [[ "$REQUEST_ACTOR" == BramVR && "$RUN_ATTEMPT" == 1 ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          resolved=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA" --jq .sha)
          [[ "$resolved" == "$CANDIDATE_SHA" ]]
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf 'Approve candidate [%s](https://github.com/%s/commit/%s) for prepared fixture windows-onboarding-prepared-v1. Permitted operations are the declared baseline and named-target Runs with exact recovery. Setup requires separately bound operator authorization. Reruns are refused; dispatch a fresh approval.\n' "$CANDIDATE_SHA" "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

  authorize:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: windows-onboarding-approval
    steps:
      - name: Bind protected environment approval to this candidate
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == 1 && "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'Authorized candidate %s.\n' "$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

  baseline:
    name: baseline
    needs: [candidate, authorize]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: windows-onboarding-host
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      DRIVER_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Reject reruns before credentials or candidate code
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == 1 && "$REQUEST_REF" == refs/heads/main ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Verify both checkouts
        run: |
          set -euo pipefail
          [[ "$(git -C driver rev-parse HEAD)" == "$DRIVER_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: candidate/go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare task-local SSH credentials
        env:
          OPERATOR_CONFIG: ${{ secrets.ONBOARDING_OPERATOR_CONFIG }}
          SSH_KEY: ${{ secrets.ONBOARDING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ONBOARDING_KNOWN_HOSTS }}
          SSH_HOSTNAME: ${{ secrets.ONBOARDING_SSH_HOSTNAME }}
          TS_CLIENT_ID: ${{ secrets.ONBOARDING_TS_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.ONBOARDING_TS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "driver/scripts")
          from onboarding_proof import ProofError, prepare_hosted_credentials
          try:
              prepare_hosted_credentials(os.environ)
          except (ProofError, OSError, ValueError, KeyError):
              raise SystemExit("Onboarding credential preparation failed.")
          PY
      - name: Connect ephemeral controller
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4.1.1
        with:
          oauth-client-id: ${{ secrets.ONBOARDING_TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.ONBOARDING_TS_CLIENT_SECRET }}
          tags: tag:blender-box-onboarding
          use-cache: false
          hostname: blender-box-proof-${{ github.run_id }}
      - name: Run the approved baseline
        run: |
          set -euo pipefail
          python3 driver/scripts/onboarding_proof.py baseline \
            --candidate "$CANDIDATE_SHA" \
            --candidate-checkout "$GITHUB_WORKSPACE/candidate" \
            --operator-config "$RUNNER_TEMP/onboarding-credentials/operator.json" \
            --output "$RUNNER_TEMP/onboarding-proof" \
            --execution hosted --driver-sha "$DRIVER_SHA"
      - name: Require a public result
        if: always()
        run: test -f "$RUNNER_TEMP/onboarding-proof/public/outcome.json"
      - name: Upload allowlisted proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-onboarding-${{ needs.candidate.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/onboarding-proof/public/outcome.json
            ${{ runner.temp }}/onboarding-proof/public/viewport.png
      - name: Remove only this job's credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "onboarding-credentials"
          for name in ("key", "known_hosts", "config", "operator.json"):
              (root / name).unlink(missing_ok=True)
          PY

  named-target:
    name: named-target
    needs: [candidate, authorize, baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: windows-onboarding-host
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      DRIVER_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Reject reruns before credentials or candidate code
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == 1 && "$REQUEST_REF" == refs/heads/main ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Verify both checkouts
        run: |
          set -euo pipefail
          [[ "$(git -C driver rev-parse HEAD)" == "$DRIVER_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: candidate/go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare task-local SSH credentials
        env:
          OPERATOR_CONFIG: ${{ secrets.ONBOARDING_OPERATOR_CONFIG }}
          SSH_KEY: ${{ secrets.ONBOARDING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ONBOARDING_KNOWN_HOSTS }}
          SSH_HOSTNAME: ${{ secrets.ONBOARDING_SSH_HOSTNAME }}
          TS_CLIENT_ID: ${{ secrets.ONBOARDING_TS_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.ONBOARDING_TS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "driver/scripts")
          from onboarding_proof import ProofError, prepare_hosted_credentials
          try:
              prepare_hosted_credentials(os.environ)
          except (ProofError, OSError, ValueError, KeyError):
              raise SystemExit("Onboarding credential preparation failed.")
          PY
      - name: Connect ephemeral controller
        uses: tailscale/github-action@53acf823325fe9ca47f4cdaa951f90b4b0de5bb9 # v4.1.1
        with:
          oauth-client-id: ${{ secrets.ONBOARDING_TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.ONBOARDING_TS_CLIENT_SECRET }}
          tags: tag:blender-box-onboarding
          use-cache: false
          hostname: blender-box-named-proof-${{ github.run_id }}
      - name: Run the approved named-target proof
        run: |
          set -euo pipefail
          python3 driver/scripts/onboarding_proof.py named-target \
            --candidate "$CANDIDATE_SHA" \
            --candidate-checkout "$GITHUB_WORKSPACE/candidate" \
            --operator-config "$RUNNER_TEMP/onboarding-credentials/operator.json" \
            --output "$RUNNER_TEMP/onboarding-named-target-proof" \
            --execution hosted --driver-sha "$DRIVER_SHA"
      - name: Require a public result
        if: always()
        run: test -f "$RUNNER_TEMP/onboarding-named-target-proof/public/outcome.json"
      - name: Upload allowlisted proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-onboarding-named-target-${{ needs.candidate.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/onboarding-named-target-proof/public/outcome.json
            ${{ runner.temp }}/onboarding-named-target-proof/public/viewport.png
      - name: Remove only this job's credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "onboarding-credentials"
          for name in ("key", "known_hosts", "config", "operator.json"):
              (root / name).unlink(missing_ok=True)
          PY

  host-install:
    name: host-install
    needs: [candidate, named-target]
    if: always() && needs.candidate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: windows-onboarding-installer
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      DRIVER_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Reject reruns before installer authorization
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RUN_ATTEMPT" == 1 && "$REQUEST_REF" == refs/heads/main ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$DRIVER_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: driver
          persist-credentials: false
      - name: Verify trusted installer driver
        run: |
          set -euo pipefail
          [[ "$(git -C driver rev-parse HEAD)" == "$DRIVER_SHA" ]]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bind separately protected installer configuration
        env:
          INSTALL_OPERATOR_CONFIG: ${{ secrets.ONBOARDING_INSTALL_OPERATOR_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, pathlib
          value = json.loads(os.environ["INSTALL_OPERATOR_CONFIG"])
          if value.get("authorization", {}).get("candidate_sha") != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("Installer authorization must bind the exact candidate.")
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "installer-authorization"
          root.mkdir(mode=0o700)
          (root / "operator.json").write_text(json.dumps(value))
          PY
      - name: Run host-install preflight before any host credentials or connection
        run: |
          set -euo pipefail
          python3 driver/scripts/onboarding_proof.py host-install \
            --candidate "$CANDIDATE_SHA" \
            --candidate-checkout "$GITHUB_WORKSPACE/candidate" \
            --operator-config "$RUNNER_TEMP/installer-authorization/operator.json" \
            --output "$RUNNER_TEMP/onboarding-host-install-proof" \
            --execution hosted --driver-sha "$DRIVER_SHA"
      - name: Require a public result
        if: always()
        run: test -f "$RUNNER_TEMP/onboarding-host-install-proof/public/outcome.json"
      - name: Upload allowlisted installer proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-onboarding-host-install-${{ needs.candidate.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/onboarding-host-install-proof/public/outcome.json
      - name: Remove only this job's installer authorization snapshot
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "installer-authorization" / "operator.json"
          path.unlink(missing_ok=True)
          PY
